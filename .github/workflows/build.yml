name: Build
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: FurtherEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    # 210 -> 120: takilirsa 3.5 saat beklemek yerine daha erken haber al.
    # Asil koruma asagidaki adim bazli timeout-minutes.
    timeout-minutes: ${{ inputs.name == 'Android' && 120 || 240 }}

    env:
      # Gradle'i tamamen non-interaktif moda kilitle.
      # Interaktif prompt = CI'da sonsuz hang.
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.internal.launcher.welcomeMessageEnabled=false"
      TERM: dumb
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        if: inputs.name == 'Android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install libVLC
        if: contains(inputs.name, 'Linux')
        run: sudo apt update && sudo apt install -y libvlc-dev libvlccore-dev

      - name: Install Libraries
        timeout-minutes: 30
        run: |
          ${{ inputs.setupCommand }}
          echo "=== Haxe Version ==="
          haxe -version
          echo "=== Haxelib List (before force set) ==="
          haxelib list

      - name: Force correct haxelib versions
        run: |
          haxelib set hxcpp git
          haxelib set lime git
          haxelib set flixel git
          haxelib set openfl 9.4.1
          haxelib set HtmlParser 3.4.0
          haxelib set colyseus 0.15.4
          haxelib set colyseus-websocket 1.0.12
          echo "=== Haxelib List (after force set) ==="
          haxelib list

      - name: Patch hxcpp for macOS 15 / Xcode 16
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ZUTIL="$HOME/haxelib/hxcpp/git/project/thirdparty/zlib-1.2.13/zutil.h"

          if [ ! -f "$ZUTIL" ]; then
            echo "zutil.h not found: $ZUTIL"
            exit 1
          fi

          perl -0pi -e 's/^[ \t]*#\s*define\s+fdopen\(fd,mode\)\s+NULL.*\R//m' "$ZUTIL"

          echo "=== fdopen check after patch ==="
          grep -n "fdopen" "$ZUTIL" || true

      - name: Configure Android
        if: inputs.name == 'Android'
        shell: bash
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}

          if [ "$RUNNER_ARCH" = "ARM64" ]; then
            echo "Using ARM64 Java"
            haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          else
            echo "Using X64 Java"
            haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          fi

          haxelib run lime config ANDROID_SETUP true

          # --- HANG FIX ---
          # Gradle'in daemon/console/prompt davranisini sabitle.
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.console=plain
          org.gradle.parallel=false
          org.gradle.caching=false
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF
          echo "=== ~/.gradle/gradle.properties ==="
          cat ~/.gradle/gradle.properties

      - name: Restore Compile Cache
        if: inputs.name != 'Android' && inputs.name != 'iOS'
        id: compile-cache
        uses: actions/cache@v4
        with:
          path: |
            export/release/${{ inputs.name == 'Windows' && 'windows' || inputs.name == 'Linux' && 'linux' || inputs.name == 'Android' && 'android' || inputs.name == 'iOS' && 'ios' || 'macos' }}/obj
          key: compile-${{ inputs.os }}-${{ inputs.buildArgs }}-${{ hashFiles('source/**', 'assets/**', '*.hx', '*.hxml', 'Project.xml', 'setup/**') }}
          restore-keys: |
            compile-${{ inputs.os }}-${{ inputs.buildArgs }}-

      - name: Clean iOS
        if: inputs.name == 'iOS'
        run: haxelib run lime clean ios || true

      # --- HANG FIX ---
      # "< /dev/null": Gradle bir sifre promptu acarsa stdin kapali oldugu icin
      # sonsuza kadar beklemek yerine aninda EOF hatasiyla duser.
      # Bu tek karakter dizisi, teshis edilemeyen hang'i okunabilir hataya cevirir.
      - name: Compile
        timeout-minutes: 75
        shell: bash
        run: |
          set -o pipefail
          haxelib run lime build ${{ inputs.buildArgs }} < /dev/null 2>&1 | tee /tmp/build.log

      # Compile takilip timeout ile olduruldugunde, neyin blokladigini gor.
      - name: Diagnose hang (only on failure)
        if: failure() && inputs.name == 'Android'
        shell: bash
        run: |
          echo "=== son 200 satir build log ==="
          tail -n 200 /tmp/build.log || true
          echo "=== calisan java/gradle process'leri ==="
          pgrep -af java || true
          echo "=== thread dump ==="
          for p in $(pgrep -f Gradle || true); do
            echo "--- pid $p ---"
            jstack "$p" 2>/dev/null | head -n 120 || true
          done
          echo "NOT: stack'te java.io.Console.readLine gorursen sebep keystore sifre promptudur."

      # --- IMZALAMA ---
      # Lime'in <certificate> etiketi Project.xml'den kaldirildigi icin
      # release APK imzasiz cikar. Imzalamayi burada apksigner ile yapiyoruz:
      # Gradle hicbir signingConfig gormez -> prompt ihtimali sifir.
      # Secrets tanimli degilse adim sessizce atlanir (fork'lar / PR'lar icin).
      - name: Sign Android APK
        if: inputs.name == 'Android'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_ALIAS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK_DIR="export/release/android/bin/app/build/outputs/apk/release"
          echo "=== APK klasoru ==="
          ls -la "$APK_DIR" || { echo "APK klasoru yok!"; exit 1; }

          if [ -z "${KS_B64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret'i tanimli degil - imzalama atlaniyor."
            echo "Cikti imzasiz APK olacak, cihaza kurulamaz."
            exit 0
          fi

          UNSIGNED=$(ls "$APK_DIR"/*-unsigned.apk 2>/dev/null | head -n1 || true)
          if [ -z "$UNSIGNED" ]; then
            echo "Imzasiz APK bulunamadi (Project.xml'de <certificate> hala acik olabilir)."
            echo "Mevcut APK'lar yukarida. Imzalama atlaniyor."
            exit 0
          fi
          echo "Imzalanacak: $UNSIGNED"

          # Keystore'u workspace DISINA yaz - artifact'a sizmasin.
          printf '%s' "$KS_B64" | base64 --decode > /tmp/release.keystore
          echo "keystore boyutu: $(wc -c < /tmp/release.keystore) bayt"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "build-tools: $BT"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" /tmp/aligned.apk

          # --ks-pass env: -> sifre ne komut satirinda gorunur ne de prompt acilir.
          "$BT/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "env:KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "env:KS_ALIAS_PASS" \
            --out "$APK_DIR/${PROJECT_NAME}-release.apk" \
            /tmp/aligned.apk

          echo "=== imza dogrulama ==="
          "$BT/apksigner" verify --print-certs "$APK_DIR/${PROJECT_NAME}-release.apk"

          rm -f /tmp/release.keystore /tmp/aligned.apk "$UNSIGNED"
          echo "=== son durum ==="
          ls -la "$APK_DIR"

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
