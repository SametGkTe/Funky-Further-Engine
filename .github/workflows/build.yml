name: Build
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: FurtherEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.name == 'Android' && 120 || 240 }}

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.internal.launcher.welcomeMessageEnabled=false"
      TERM: dumb
      CI: "true"
      ANDROID_GRADLE_TASK: assembleRelease

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        if: success() && inputs.name == 'Android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install libVLC
        if: success() && contains(inputs.name, 'Linux')
        run: sudo apt update && sudo apt install -y libvlc-dev libvlccore-dev

      - name: Install Libraries
        timeout-minutes: 30
        run: |
          ${{ inputs.setupCommand }}
          echo "=== Haxe Version ==="
          haxe -version
          echo "=== Haxelib List (before force set) ==="
          haxelib list

      - name: Force correct haxelib versions
        run: |
          haxelib set hxcpp git
          haxelib set lime git
          haxelib set flixel git
          haxelib set openfl 9.4.1
          haxelib set HtmlParser 3.4.0
          haxelib set colyseus 0.15.4
          haxelib set colyseus-websocket 1.0.12
          haxelib install tink_core 2.1.1 --quiet --always
          haxelib set tink_core 2.1.1
          echo "=== Haxelib List (after force set) ==="
          haxelib list

      # iOS: resmî lime 8.3.2 (SDL 2.30.x — harici klavye + iOS ağ çökmesi
      # düzeltmeleri). Adım koşulu Actions katmanında değerlendirilir; satır içi
      # bash koşulu Windows'ta PowerShell'e takılıyordu.
      - name: iOS lime 8.3.2
        if: success() && inputs.name == 'iOS'
        shell: bash
        run: |
          haxelib install lime 8.3.2 --quiet --always
          haxelib set lime 8.3.2
          haxelib list | grep -i lime || true

      - name: Patch hxcpp for macOS 15 / Xcode 16
        if: success() && runner.os == 'macOS'
        shell: bash
        run: |
          ZUTIL="$HOME/haxelib/hxcpp/git/project/thirdparty/zlib-1.2.13/zutil.h"

          if [ ! -f "$ZUTIL" ]; then
            echo "zutil.h not found: $ZUTIL"
            exit 1
          fi

          perl -0pi -e 's/^[ \t]*#\s*define\s+fdopen\(fd,mode\)\s+NULL.*\R//m' "$ZUTIL"

          echo "=== fdopen check after patch ==="
          grep -n "fdopen" "$ZUTIL" || true

      - name: Configure Android
        if: success() && inputs.name == 'Android'
        shell: bash
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}

          if [ "$RUNNER_ARCH" = "ARM64" ]; then
            echo "Using ARM64 Java"
            haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          else
            echo "Using X64 Java"
            haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          fi

          haxelib run lime config ANDROID_SETUP true

          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.console=plain
          org.gradle.parallel=false
          org.gradle.caching=false
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF
          echo "=== ~/.gradle/gradle.properties ==="
          cat ~/.gradle/gradle.properties

      - name: Restore Compile Cache
        if: success() && inputs.name != 'Android' && inputs.name != 'iOS'
        id: compile-cache
        uses: actions/cache@v4
        with:
          path: |
            export/release/${{ inputs.name == 'Windows' && 'windows' || inputs.name == 'Linux' && 'linux' || inputs.name == 'Android' && 'android' || inputs.name == 'iOS' && 'ios' || 'macos' }}/obj
          key: compile-${{ inputs.os }}-${{ inputs.buildArgs }}-${{ hashFiles('source/**', 'assets/**', '*.hx', '*.hxml', 'Project.xml', 'setup/**') }}
          restore-keys: |
            compile-${{ inputs.os }}-${{ inputs.buildArgs }}-

      - name: Clean iOS
        if: success() && inputs.name == 'iOS'
        run: haxelib run lime clean ios || true
        
      - name: Prepare Android signing
        if: success() && inputs.name == 'Android'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_ALIAS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KS_B64:-}" ]; then
            echo "Keystore secret'i tanimli degil."
            echo "UYARI: packageRelease 'missing storeFile' hatasi verecek."
            exit 0
          fi

          APP_DIR="export/release/android/bin/app"
          mkdir -p "$APP_DIR"

          printf '%s' "$KS_B64" | base64 --decode > /tmp/release.keystore
          echo "keystore: $(wc -c < /tmp/release.keystore) bayt"

          umask 077
          {
            printf 'KEY_STORE=%s\n'                "/tmp/release.keystore"
            printf 'KEY_STORE_PASSWORD=%s\n'       "$KS_PASS"
            printf 'KEY_STORE_ALIAS=%s\n'          "$KS_ALIAS"
            printf 'KEY_STORE_ALIAS_PASSWORD=%s\n' "$KS_ALIAS_PASS"
          } > "$APP_DIR/signing.properties"
          chmod 600 "$APP_DIR/signing.properties"

          echo "signing.properties yazildi (sifreler gizlendi):"
          sed 's/\(PASSWORD=\).*/\1***/' "$APP_DIR/signing.properties"

      - name: Compile
        timeout-minutes: 75
        shell: bash
        run: |
          set -o pipefail
          haxelib run lime build ${{ inputs.buildArgs }} < /dev/null 2>&1 | tee /tmp/build.log

      - name: Diagnose hang (only on failure)
        if: failure() && inputs.name == 'Android'
        shell: bash
        run: |
          echo "=== son 200 satir build log ==="
          tail -n 200 /tmp/build.log || true
          echo "=== calisan java/gradle process'leri ==="
          pgrep -af java || true
          echo "=== thread dump ==="
          for p in $(pgrep -f Gradle || true); do
            echo "--- pid $p ---"
            jstack "$p" 2>/dev/null | head -n 120 || true
          done
          echo "NOT: stack'te java.io.Console.readLine gorursen sebep keystore sifre promptudur."
      - name: Ensure release APK
        if: success() && inputs.name == 'Android'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_ALIAS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          REL="export/release/android/bin/app/build/outputs/apk/release"
          GP="export/release/android/bin"

          if ls "$REL"/*.apk >/dev/null 2>&1; then
            echo "Release APK zaten uretilmis:"
            ls -la "$REL"
            exit 0
          fi

          echo "Release APK yok - Gradle assembleRelease dogrudan calistiriliyor."

          if [ -n "${KS_B64:-}" ]; then
            mkdir -p "$GP/app"
            umask 077
            printf '%s' "$KS_B64" | base64 --decode > /tmp/release.keystore
            {
              printf 'KEY_STORE=%s\n'                "/tmp/release.keystore"
              printf 'KEY_STORE_PASSWORD=%s\n'       "$KS_PASS"
              printf 'KEY_STORE_ALIAS=%s\n'          "$KS_ALIAS"
              printf 'KEY_STORE_ALIAS_PASSWORD=%s\n' "$KS_ALIAS_PASS"
            } > "$GP/app/signing.properties"
            chmod 600 "$GP/app/signing.properties"
            echo "signing.properties tazelendi."
          fi


          if [ ! -f "$GP/gradlew" ]; then
            echo "gradlew bulunamadi: $GP"
            ls -la "$GP" 2>/dev/null || echo "(klasor yok)"
            exit 1
          fi

          cd "$GP"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain --stacktrace < /dev/null
          cd - >/dev/null

          echo "=== assembleRelease sonrasi ==="
          if ! ls -la "$REL" 2>/dev/null; then
            echo "Release klasoru hala yok. Bulunan tum APK'lar:"
            find export -name "*.apk" 2>/dev/null || true
            exit 1
          fi

      - name: Sign Android APK
        if: success() && inputs.name == 'Android'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_ALIAS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK_DIR="export/release/android/bin/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "Beklenen APK klasoru yok: $APK_DIR"
            echo "Alternatif yollar araniyor..."
            FOUND=$(find export -type d -path "*outputs/apk/*" 2>/dev/null | head -n1 || true)
            if [ -n "$FOUND" ]; then
              echo "Bulundu: $FOUND"
              APK_DIR="$FOUND"
            else
              echo ""
              echo "############ TESHIS ############"
              echo "--- export agaci (4 seviye) ---"
              find export -maxdepth 4 -type d 2>/dev/null | head -n 60 || echo "(export klasoru yok)"
              echo "--- tum .apk dosyalari ---"
              find . -name "*.apk" -not -path "./.git/*" 2>/dev/null || echo "(hic apk yok)"
              echo "--- tum .aab dosyalari ---"
              find . -name "*.aab" -not -path "./.git/*" 2>/dev/null || echo "(hic aab yok)"
              echo "--- gradle cikti klasorleri ---"
              find export -type d -name "outputs" 2>/dev/null || echo "(outputs klasoru yok)"
              echo "--- android bin icerigi ---"
              ls -la export/release/android/bin 2>/dev/null || echo "(bin yok)"
              echo "################################"
              echo ""
              echo "Compile basarili gorundu ama APK uretilmemis."
              echo "Muhtemel sebep: lime Gradle assemble adimini calistirmadi."
              exit 1
            fi
          fi

          echo "=== APK klasoru: $APK_DIR ==="
          ls -la "$APK_DIR"

          if [ -z "${KS_B64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret'i tanimli degil - imzalama atlaniyor."
            echo "Cikti imzasiz APK olacak, cihaza kurulamaz."
            exit 0
          fi

          TARGET=$(ls "$APK_DIR"/*-unsigned.apk 2>/dev/null | head -n1 || true)

          if [ -z "$TARGET" ]; then
            TARGET=$(ls "$APK_DIR"/*.apk 2>/dev/null | grep -v -- "-debug\.apk$" | head -n1 || true)
            if [ -n "$TARGET" ]; then
              echo "Imzasiz APK yok; mevcut release APK yeniden imzalanacak."
              echo "(apksigner eski imzayi kaldirip yenisini uygular)"
            fi
          fi

          if [ -z "$TARGET" ]; then
            echo "Imzalanacak release APK bulunamadi."
            echo "Klasordeki dosyalar:"
            ls -la "$APK_DIR"
            case "$APK_DIR" in
              *"/debug") echo "UYARI: sadece DEBUG APK var. 'Ensure release APK' adimi calisti mi?" ;;
            esac
            exit 1
          fi
          echo "Imzalanacak: $TARGET"

          # Keystore'u workspace DISINA yaz - artifact'a sizmasin.
          printf '%s' "$KS_B64" | base64 --decode > /tmp/release.keystore
          echo "keystore boyutu: $(wc -c < /tmp/release.keystore) bayt"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "build-tools: $BT"

          OUT="$APK_DIR/${PROJECT_NAME}-release.apk"

          "$BT/zipalign" -p -f 4 "$TARGET" /tmp/aligned.apk

          "$BT/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "env:KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "env:KS_ALIAS_PASS" \
            --out /tmp/signed.apk \
            /tmp/aligned.apk

          echo "=== imza dogrulama ==="
          "$BT/apksigner" verify --print-certs /tmp/signed.apk

          # Kaynak APK'yi kaldir, imzalanmisi yerine koy
          rm -f "$TARGET"
          mv /tmp/signed.apk "$OUT"

          rm -f /tmp/release.keystore /tmp/aligned.apk
          rm -f "export/release/android/bin/app/signing.properties" 2>/dev/null || true
          echo "=== son durum ==="
          ls -la "$APK_DIR"

      - name: Make IPA
        if: success() && inputs.name == 'iOS'
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
