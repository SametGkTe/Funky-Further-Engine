name: Android Legacy ARMv7

on:
  workflow_dispatch:

# Eski 32-bit Android cihazlar için isteğe bağlı build.
# Ana release workflow'u hızlı ve modern ARM64 olarak kalır.
jobs:
  build-android-armv7:
    name: Android Legacy ARMv7
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      # Reusable build.yml Android SDK/NDK ve signing adımlarını bu değerle açar.
      name: Android
      os: macos-15
      setupCommand: sh ./setup/unix.sh
      buildArgs: "android -D ONLY_ARMV7 -final"
      artifactName: Further-Engine-Android-ARMv7
      artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
