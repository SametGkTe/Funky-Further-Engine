name: Hata bildirimi
description: Further Engine'de karşılaştığınız yeniden üretilebilir bir hatayı bildirin.
title: "[HATA] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Bildirimden önce aynı sorunun daha önce açılmadığını kontrol edin. Mod kullanıyorsanız hatayı mümkünse modsuz veya Güvenli Modda da deneyin.

  - type: input
    id: version
    attributes:
      label: Further Engine sürümü
      description: Ana menüde/FPS sayacında görünen sürüm veya commit etiketi.
      placeholder: "Örn. 1.5.3 veya devbuild-abcdef0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS Intel
        - macOS Apple Silicon
        - Android
        - iOS
        - Diğer
    validations:
      required: true

  - type: input
    id: platform-version
    attributes:
      label: İşletim sistemi / cihaz
      placeholder: "Örn. Windows 11 24H2 veya Android 14 — Samsung A54"
    validations:
      required: true

  - type: dropdown
    id: menu-style
    attributes:
      label: Menü stili
      options:
        - Klasik
        - Yeni / V-Slice
        - Her ikisinde de oluyor
        - İlgili değil / Bilmiyorum
    validations:
      required: true

  - type: dropdown
    id: modding
    attributes:
      label: Modlama durumu
      options:
        - Mod kullanmıyorum
        - Lua modu
        - HScript modu
        - Kaynak kod değişikliği
        - Birden fazlası
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Hatanın açıklaması
      description: Ne olmasını bekliyordunuz, gerçekte ne oldu?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Yeniden üretme adımları
      placeholder: |
        1. Oyunu aç
        2. Mods menüsüne gir
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash log / logcat
      description: Kişisel bilgi veya erişim anahtarı bulunmadığını kontrol ederek logs klasöründeki ilgili içeriği ekleyin.
      render: shell
    validations:
      required: false

  - type: textarea
    id: mods
    attributes:
      label: Aktif modlar ve yaptığınız değişiklikler
      placeholder: "Mod adları, değiştirdiğiniz kaynak dosyaları veya 'Yok'."
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Son kontroller
      options:
        - label: Aynı hatayı bildiren açık bir issue aradım.
          required: true
        - label: Mümkünse hatayı Güvenli Modda veya modlar kapalıyken denedim.
          required: false
        - label: Paylaştığım loglarda şifre, token veya kişisel bilgi bulunmadığını kontrol ettim.
          required: true
