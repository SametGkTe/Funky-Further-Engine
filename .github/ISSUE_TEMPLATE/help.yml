name: Yardım isteği
description: Further Engine kullanımı, modlama veya derleme hakkında yardım isteyin.
title: "[YARDIM] "
labels: [help wanted]
body:
  - type: input
    id: version
    attributes:
      label: Further Engine sürümü
      placeholder: "Örn. 1.5.3"
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: Konu
      options:
        - Oyunu çalıştırma
        - Kaynak koddan derleme
        - Lua modlama
        - HScript modlama
        - Android / mobil kontroller
        - Mod paketi yükleme
        - Galeri sistemi
        - Diğer
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - iOS
        - Diğer
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Ne yapmaya çalışıyorsunuz?
      description: Hedefinizi ve izlediğiniz rehberi açıklayın.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Nerede takıldınız?
      description: Denediğiniz yöntemleri ve aldığınız hata mesajını paylaşın.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: İlgili log veya kod
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Kontrol
      options:
        - label: Wiki, README ve mevcut issue'larda çözüm aradım.
          required: true
